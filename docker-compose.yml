# Local Postgres for development and tests: `pnpm db:up`
services:
  db:
    image: postgres:16-alpine
    container_name: hostly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostly
      POSTGRES_PASSWORD: hostly
      POSTGRES_DB: hostly
    ports:
      # Override with HOSTLY_DB_PORT=5433 if 5432 is taken (and update DATABASE_URL).
      - '${HOSTLY_DB_PORT:-5432}:5432'
    volumes:
      - hostly-db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hostly -d hostly']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  hostly-db:
